spring:
  application:
    name: people-miner-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:people_miner}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${PORT:3000}
  servlet:
    context-path: /api

# CORS Configuration
cors:
  allowed-origins:
    - http://localhost:5173
    - http://localhost:3000

# GitHub Configuration
github:
  token: ${GITHUB_TOKEN:}

# Application Configuration
app:
  target-role: ${TARGET_ROLE:all}

# Logging
logging:
  level:
    root: INFO
    com.peopleminer: DEBUG
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
